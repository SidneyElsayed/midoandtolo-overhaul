<header class="sticky top-0 z-30 bg-[var(--bg-color)]">
<!-- <section id="section-{{forloop.index}}"> -->
  <div class="">

    <!-- desktop menu -->
    <div class="flex justify-between p-3 px-6">
      
      <!-- logo -->
      <div class="content-center">
        <a href="/index" class="mx-2">
          <img src="/images/mido-tolo-color-logo-b.png" class="max-w-48 md:max-w-36 block">
        </a>
      </div>

      <!-- links -->
      <nav class="hidden md:flex gap-4 featured-text text-xs mx-0 md:content-center">
      {% for link in site.data.navigation.header-links %}

        {% if link.sublinks %}
          <span class="relative group p-2 md:content-center">
        {% endif %}
        
        <a href="{{link.url}}" class=" p-2 my-4 featured-font md:content-center">{{link.text}}</a>

        {% if link.sublinks %}
        <div class="absolute pt-2 top-14 left-0 bg-[var(--bg-color)] hidden group-hover:block z-20">
          {% for sublink in link.sublinks %}
            <a href="{{sublink.url}}" class="py-2 px-4 whitespace-pre block body-font">{{sublink.text}}</a>
          {% endfor %}
        </div>
          </span>
        {% endif %}

      {% endfor %}
      </nav>

      <!-- hamburger button -->
      <div class="md:hidden">
        <a class="hamburger-button md:hidden"> &#9776; </a>
      </div>

    </div>
    <!-- end desktop menu -->

    <!-- mobile menu -->
    <div class="md:hidden">
      <div class="mobile-menu text-left overflow-y-scroll max-h-[100vh] w-1/2">
        <nav class="relative">
          {% for link in site.data.navigation.header-links %}
          <a href="{{link.url}}" class=" p-2 my-4 featured-font">{{link.text}}</a>
          {% endfor %}
        </nav>
      </div>
    </div>
  </div>
<!-- </section> -->
</header>
